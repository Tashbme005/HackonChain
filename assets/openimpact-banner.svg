<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="OpenImpact">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3EA"/>
      <stop offset="55%" stop-color="#E8F2EE"/>
      <stop offset="100%" stop-color="#D5EBE3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#1E8F6F" opacity="0.08"/>
  <circle cx="160" cy="360" r="140" fill="#1E8F6F" opacity="0.06"/>

  <!-- seal mark -->
  <g transform="translate(96,140)">
    <rect width="120" height="120" rx="28" fill="#1E8F6F"/>
    <circle cx="60" cy="60" r="28" fill="none" stroke="#F4F6F5" stroke-width="9"/>
    <rect x="54" y="22" width="12" height="76" rx="6" fill="#F4F6F5"/>
  </g>

  <text x="248" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#1A1F1C">Open</text>
  <text x="468" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#1E8F6F">Impact</text>
  <text x="248" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.28em" fill="#5C6B64">TRANSPARENCY YOU CAN SEE</text>
  <text x="248" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#3D4A44">Donation receipts you can verify end to end</text>
</svg>
