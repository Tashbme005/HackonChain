<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="1200" height="900" fill="#F4F6F5"/>

  <!-- eyebrow -->
  <text x="140" y="70" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="7" fill="#6B7A78">OPENIMPACT · BRAND SYSTEM v2</text>

  <!-- ============ PRIMARY LOCKUP ============ -->
  <g>
    <!-- OI mark: O as a ring (seal), I as a bar straight through it (a pin
         through a coin / a receipt spike) — nothing hidden, nothing to hide -->
    <rect x="140" y="112" width="176" height="176" rx="42" fill="#1E8F6F"/>
    <circle cx="228" cy="200" r="50" fill="none" stroke="#F4F6F5" stroke-width="14"/>
    <rect x="220" y="134" width="16" height="132" rx="8" fill="#F4F6F5"/>

    <!-- wordmark -->
    <text x="356" y="228" font-family="'Fraunces','Georgia',serif" font-size="96" font-weight="600" letter-spacing="-1.5"><tspan fill="#12333B">Open</tspan><tspan fill="#1E8F6F">Impact</tspan></text>
    <text x="358" y="278" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#6B7A78">TRANSPARENCY YOU CAN SEE</text>
  </g>

  <!-- divider -->
  <line x1="140" y1="360" x2="1060" y2="360" stroke="#12333B" stroke-width="1.5" opacity="0.10"/>

  <!-- ============ ICON VARIANTS ============ -->
  <!-- Tile A: primary app icon -->
  <g>
    <rect x="140" y="430" width="170" height="170" rx="40" fill="#1E8F6F"/>
    <circle cx="225" cy="515" r="48" fill="none" stroke="#F4F6F5" stroke-width="13"/>
    <rect x="217.5" y="451.25" width="15" height="127.5" rx="7.5" fill="#F4F6F5"/>
    <text x="225" y="640" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="600" fill="#6B7A78" text-anchor="middle">App icon</text>
  </g>

  <!-- Tile B: dark -->
  <g>
    <rect x="345" y="430" width="170" height="170" rx="40" fill="#12333B"/>
    <circle cx="430" cy="515" r="48" fill="none" stroke="#F4F6F5" stroke-width="13"/>
    <rect x="422.5" y="451.25" width="15" height="127.5" rx="7.5" fill="#1E8F6F"/>
    <text x="430" y="640" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="600" fill="#6B7A78" text-anchor="middle">Dark</text>
  </g>

  <!-- Tile C: mono -->
  <g>
    <rect x="550" y="430" width="170" height="170" rx="40" fill="#F4F6F5" stroke="#12333B" stroke-width="2"/>
    <circle cx="635" cy="515" r="48" fill="none" stroke="#12333B" stroke-width="13"/>
    <rect x="627.5" y="451.25" width="15" height="127.5" rx="7.5" fill="#12333B"/>
    <text x="635" y="640" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="600" fill="#6B7A78" text-anchor="middle">Mono</text>
  </g>

  <!-- meaning note + scale proof -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <text x="800" y="470" font-size="22" font-weight="700" fill="#12333B">The mark</text>
    <text x="800" y="503" font-size="18" fill="#5C6A68">O, ringed like a seal.</text>
    <text x="800" y="529" font-size="18" fill="#5C6A68">I, straight through the middle —</text>
    <text x="800" y="555" font-size="18" fill="#5C6A68">nothing hidden, nothing to hide.</text>

    <!-- same mark, shrinking, to prove it holds up small -->
    <rect x="800" y="575" width="60" height="60" rx="15" fill="#1E8F6F"/>
    <circle cx="830" cy="605" r="17" fill="none" stroke="#F4F6F5" stroke-width="4.8"/>
    <rect x="824.6" y="588.7" width="5.4" height="32.6" rx="2.7" fill="#F4F6F5"/>

    <rect x="880" y="593" width="42" height="42" rx="11" fill="#1E8F6F"/>
    <circle cx="901" cy="614" r="12" fill="none" stroke="#F4F6F5" stroke-width="3.4"/>
    <rect x="897.2" y="602.8" width="3.8" height="22.8" rx="1.9" fill="#F4F6F5"/>

    <rect x="940" y="609" width="26" height="26" rx="7" fill="#1E8F6F"/>
    <circle cx="953" cy="622" r="7.4" fill="none" stroke="#F4F6F5" stroke-width="2.1"/>
    <rect x="950.6" y="614.9" width="2.4" height="14.2" rx="1.2" fill="#F4F6F5"/>

    <text x="800" y="658" font-size="15" fill="#6B7A78">Reads clean from favicon to hero.</text>
  </g>

  <!-- ============ PALETTE ============ -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <text x="140" y="712" font-size="20" font-weight="700" letter-spacing="4" fill="#6B7A78">PALETTE</text>

    <rect x="140" y="730" width="168" height="90" rx="14" fill="#12333B"/>
    <text x="140" y="843" font-size="17" font-weight="700" fill="#12333B">Ink</text>
    <text x="140" y="864" font-size="15" fill="#6B7A78">#12333B</text>

    <rect x="328" y="730" width="168" height="90" rx="14" fill="#1E8F6F"/>
    <text x="328" y="843" font-size="17" font-weight="700" fill="#12333B">Verified</text>
    <text x="328" y="864" font-size="15" fill="#6B7A78">#1E8F6F</text>

    <rect x="516" y="730" width="168" height="90" rx="14" fill="#D98F3E"/>
    <text x="516" y="843" font-size="17" font-weight="700" fill="#12333B">Pending</text>
    <text x="516" y="864" font-size="15" fill="#6B7A78">#D98F3E</text>

    <rect x="704" y="730" width="168" height="90" rx="14" fill="#C1443C"/>
    <text x="704" y="843" font-size="17" font-weight="700" fill="#12333B">Flagged</text>
    <text x="704" y="864" font-size="15" fill="#6B7A78">#C1443C</text>

    <rect x="892" y="730" width="168" height="90" rx="14" fill="#F4F6F5" stroke="#12333B" stroke-width="1.5"/>
    <text x="892" y="843" font-size="17" font-weight="700" fill="#12333B">Paper</text>
    <text x="892" y="864" font-size="15" fill="#6B7A78">#F4F6F5</text>
  </g>
</svg>
